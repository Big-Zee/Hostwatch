# HostWatch configuration
#
# Installed copy: /etc/hostwatch/config.ini (owner root, mode 600).
# It holds the Slack webhook secret. Never commit a real webhook URL.

[slack]
# Incoming webhook URL (Slack app settings -> Incoming Webhooks). Required.
webhook_url = https://hooks.slack.com/services/REPLACE/WITH/YOUR-WEBHOOK

[boot]
# Comma-separated interface name prefixes left out of the local IP list
# (loopback is always left out).
skip_interfaces = docker,br-,veth,virbr,vnet,lxc,lxd,tun,tap,cni,flannel,zt,tailscale,wg
# Also list global IPv6 addresses: true or false.
include_ipv6 = false

[display]
# Timezone for timestamps: "local" (system timezone) or an IANA name such as Europe/Warsaw.
timezone = local
# Optional friendly name shown with the hostname, e.g. "Office PC (office-pc)".
# Useful when several machines post to the same channel. Leave unset for hostname only.
# machine_name = Office PC

[heartbeat]
# Periodic "still alive" message with uptime, users and top processes.
# Set to false to stop heartbeats without uninstalling (takes effect at the next run).
enabled = true
# Minutes between heartbeats, counted from boot (5-1440).
# After changing it, run install.sh again to apply it to the timer.
interval_minutes = 60
